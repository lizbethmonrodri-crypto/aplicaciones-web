<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario</title>
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="encabezado">
        <h1>Recetario</h1>
    </div>
    <div class="contenedor">
        
        <div class="receta">
            
            <div class="seccion">
                <h2>Ingredientes</h2>
                
                <div class="ingrediente" id="limon">
                    <p>5 limones</p>
                </div>
                
                <div class="ingrediente" id="agua">
                    <p>1 litro de agua</p>
                </div>
                
                <div class="ingrediente" id="azucar">
                    <p>3 cucharadas de azúcar</p>
                </div>
            </div>

            <div class="seccion">
                <h2>Preparación</h2>
                <div class="preparacion">
                    <p>Vacía los 3 ingredientes en una jarra.</p>
                    <p>Mezcla todo.</p>
                </div>
            </div>

            <div class="boton">
                <button id="btnModo">Modo Oscuro</button>
            </div>

        </div>

        <div class="imagenDerecha">
            <div class="tituloImagen">
                <h2>Imagen</h2>
            </div>
            <div class="contenedorImagen">
                <img id="imagenReferencia" src="../img/final.png" alt="Imagen de referencia">
            </div>
        </div>

    </div>
    <script src="../javaScript/function.js"></script>
</body>
</html>
